name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  id-token: write           # required for OIDC
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Pull + rebuild on the server
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=[
              "cd /opt/app",
              "sudo -H -u $(stat -c %U .) git pull --ff-only",
              "docker compose -f docker-compose.prod.yml up -d --build",
              "docker compose -f docker-compose.prod.yml exec -T api npx typeorm -d dist/config/data-source.js migration:run",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)

          echo "SSM command: $CMD_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            [ "$STATUS" = "Success" ] && break
            [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] && break
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query StandardErrorContent --output text
          test "$STATUS" = "Success"
